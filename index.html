function buildForm(){
 const fh=([k,l,t,o])=>{
  if(t==="chk")return `<div class="chk"><input type="checkbox" data-k="${k}" id="f_${k}"><label for="f_${k}" style="margin:0;font-size:15px;color:var(--tx)">${l}</label></div>`;

  if(t==="combo"){const cur=f[k],inList=!cur||S.lists[o].some(x=>norm(x)===norm(cur));

  return `<div><label>${l}</label><input data-k="${k}"></div>`};
  $("form").innerHTML=SPEC.map(fh).join("")+'<div id="form2"></div>';

 document.querySelectorAll("#form [data-k],#form2 [data-k]").forEach(e=>{
  const k=e.dataset.k;

   const ni=document.querySelector('[data-new="'+k+'"]');
   e.onchange=()=>{if(e.value==="__new__"){ni.style.display="";f[k]=ni.value;ni.focus()}else{ni.style.display="none";f[k]=e.value}upd()};
   ni.oninput=()=>{f[k]=ni.value;upd()};
   return}

 buildDs()}
 
 function buildDs(){

function maskQ(el){const nd=el.value.slice(0,el.selectionStart).replace(/\D/g,"").length,d=el.value.replace(/\D/g,"").replace(/^0+/,"");el.value=d?grp(d):"";let c=0,i=0;for(;i<el.value.length&&c<nd;i++)if(/\d/.test(el.value[i]))c++;try{el.setSelectionRange(i,i)}catch(x){}return d}
function maskC(el,ev){let v=el.value,cp=el.selectionStart;

let c=0,i=0;for(;i<el.value.length&&c<nd;i++)if(/[\d,]/.test(el.value[i]))c++;

function fecha(s){const [y,m,dd]=s.split("-").map(Number),t=new Date(y,m-1,dd),n=new Date();const hoy=t.toDateString()===n.toDateString();return (hoy?"HOY, ":"")+DIA[t.getDay()]+" "+dd+" de "+MES[m-1]+" de "+y}
const CF=["🕛","🕐","🕑","🕒","🕓","🕔","🕕","🕖","🕗","🕘","🕙","🕚"],CH=["🕧","🕜","🕝","🕞","🕟","🕠","🕡","🕢","🕣","🕤","🕥","🕦"];
function clock(h){const [a,b]=h.split(":").map(Number);const i=Math.floor((a*60+b)/30)%24;return (i%2?CH:CF)[Math.floor(i/2)%12]}
const greet=()=>{const h=new Date().getHours();return h<=11?"🌅 Buenos días":h<=18?"🌇 Buenas tardes":"🌆 Buenas noches"};
const icon=p=>p?(/INDUSTRIAL/.test(p)?"🛢️":"🛢️"):"🛢️";

 function msg(){
 const U=s=>s.toUpperCase();
 let m=greet()+"\n🆕 @"+f.coord+" por favor coordinar el siguiente pedido";
 if(f.urg)m+="\n\n‼️ *URGENTE* ‼️";
 m+="\n\n🏢 Cliente :  *"+U(f.cli)+"*"+(f.est?"  📌  *"+U(f.est)+"*":"");
 const R=d.filter(r=>r.q),mu=R.length>1,mp=new Set(R.map(r=>norm(r.p))).size>1,p0=R[0]?R[0].p:"";
  m+="\n🏭 Terminal : *"+U(f.term)+"*\n\n"+(mu?"":(R[0]&&R[0].op?"📄 Orden producto : *"+R[0].op+"*\n":"")+(R[0]&&R[0].ot?"📄 Orden transporte : *"+R[0].ot+"*\n":""))+(mp?"":icon(p0)+" Producto : *"+p0+"*\n");
 R.forEach((r,i)=>{const sp=mu?" - ":"\n";let t=(mp?icon(r.p)+" Producto : *"+r.p+"*"+sp:"")+"🔢 Cantidad : *"+num(r.q)+"* galones";
  if(r.f)t+=sp+"📅 Despacho : *"+fecha(r.f)+"*";
  if(r.h)t+=sp+"⏲️ Hora Entrega : *"+r.h.replace(":","h")+"* "+clock(r.h);
  if(r.c)t+=sp+"🚛 Transporte : $ *"+money(r.c)+"*";
   if(mu){if(r.op)t+=" - 📄 Orden producto : *"+r.op+"*";if(r.ot)t+=" - 📄 Orden transporte : *"+r.ot+"*"} 
      m+=(mu?"*"+(i+1)+"* - ":"")+t+(mu?"\n":"")});
 if(!mu)m+="\n";
 
 m+="\n📜 @"+f.nota+" por favor su ayuda con la emisión de la orden"+(f.urg?" de manera *PRIORITARIA*":"")+(f.factor?" una vez que @"+f.coord+" nos ayude con el factor de corrección 🌡️":"");
 if(f.petro)m+="\n👩🏽\u200d💻 @"+f.petro+" por favor su ayuda con la programación del despacho con PETROECUADOR";
  if(f.fact)m+="\n🧾 @"+f.fact+" "+PRIO[f.prio||"Baja"]+" 📋 @"+f.coord;
  
 if(f.fact&&d.some(r=>r.c))m+="\n🚛 @"+f.fact+" considerar el costo del transporte por cada orden";
 
if(f.guia)m+="\n📃 @"+f.guia+" favor su ayuda con la guía electrónica inmediatamente cuando nos envíe los documentos el gestor 📋 @"+f.coord;
 return m+"\n\n👩🏽\u200d💼 _Quedo pendiente para confirmar al cliente la entrega_ 🫱🏼\u200d🫲🏼"}
const clean=s=>s.replace(/\*/g,"").replace(/_/g,"").replace(/@/g,"");
const ready=()=>f.coord&&f.cli&&f.term&&f.nota&&d.some(r=>r.q)&&d.every(r=>!r.q||r.p);
function upd(){
 $("pv").textContent=clean(msg());$("pv").className=f.urg?"u":"";
 $("sd").disabled=!!sentAt||!ready();
 $("sent").textContent=sentAt?"✅ Registrado el "+sentAt+". Si WhatsApp no se abrió, toca «Abrir WhatsApp» (el mensaje también quedó copiado para pegarlo). Luego pulsa «Nuevo».":(ready()?"":"Completa coordinador, cliente, terminal, nota de pedido y, en cada despacho, producto y cantidad.")}
function stamp(){const n=new Date(),p=x=>String(x).padStart(2,"0");return p(n.getDate())+"."+MES[n.getMonth()].slice(0,3)+"."+n.getFullYear()+" - "+p(n.getHours())+":"+p(n.getMinutes())+":"+p(n.getSeconds())}
$("sd").onclick=()=>{$("cf").style.display="block"};
$("cn").onclick=()=>{$("cf").style.display="none"};
function copyTxt(t){try{const r=navigator.clipboard.writeText(t);if(r&&r.catch)r.catch(()=>{})}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove()}}
$("cy").onclick=()=>{
 $("cf").style.display="none";
 const added=[],touched=new Set();
 [["personal","coord"],["personal","nota"],["personal","petro"],["personal","fact"],["personal","guia"],["terminales","term"],["clientes","cli"],["estab","est"]].forEach(([lk,fk])=>{
  let v=String(f[fk]||"").replace(/\s+/g," ").trim();if(!v)return;
  const ex=S.lists[lk].find(x=>norm(x)===norm(v));
  if(ex){f[fk]=ex;return}
  if(lk==="productos"||lk==="clientes"||lk==="estab")v=v.toUpperCase();
  S.lists[lk].push(v);f[fk]=v;added.push(v);touched.add(lk)});
  d.forEach(r=>{let v=String(r.p||"").replace(/\s+/g," ").trim();if(!v)return;const ex=S.lists.productos.find(x=>norm(x)===norm(v));if(ex){r.p=ex;return}v=v.toUpperCase();S.lists.productos.push(v);r.p=v;added.push(v);touched.add("productos")});
 touched.forEach(lk=>S.lists[lk].sort((a,b)=>a.localeCompare(b,"es")));
 const m=msg();sentAt=stamp();
 S.hist.push("📨 Mensaje enviado via Whatsapp el...: "+sentAt+"\n\n"+clean(m));hi=S.hist.length-1;
 S.log.push({fecha:sentAt,coordinador:f.coord,cliente:f.cli,establecimiento:f.est,producto:[...new Set(d.filter(r=>r.q).map(r=>r.p))].join(", "),terminal:f.term,orden_producto:[...new Set(d.filter(r=>r.q&&r.op).map(r=>r.op))].join(", "),orden_transporte:[...new Set(d.filter(r=>r.q&&r.ot).map(r=>r.ot))].join(", "),nota_pedido:f.nota,urgente:f.urg?"SI":"NO",petroecuador:f.petro,facturacion:f.fact,prioridad_factura:f.prio,guia_electronica:f.guia,factor:f.factor?"SI":"NO",despachos:d.filter(r=>r.q).map(r=>[r.p,num(r.q)+" gal",r.f,r.h,r.c].filter(Boolean).join(" | ")).join(" ; ")});save();
 const url="https://api.whatsapp.com/send?phone="+S.phone.replace(/\D/g,"")+"&text="+encodeURIComponent(m)+"&app_absent=1&send=1";
 const a=$("wl");a.href=url;a.style.display="block";
 copyTxt(m);
 try{a.click()}catch(e){}
 lists();buildForm();upd();hist();
 if(added.length)$("sent").textContent+=" Se agregaron a Ajustes: "+added.join(", ")+".";};
$("cp").onclick=async()=>{const t=msg();try{await navigator.clipboard.writeText(t);$("cp").textContent="✅ Copiado"}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove();$("cp").textContent="✅ Copiado"}setTimeout(()=>$("cp").textContent="📋 Copiar",1500)};

 $("nw").onclick=()=>{sentAt="";$("wl").style.display="none";$("cf").style.display="none";
 f={coord:"",cli:"",est:"",term:"",op:"",ot:"",nota:"",urg:false,petro:"",fact:"",prio:"",guia:"",factor:false};
 d=[{p:"",q:"",f:"",h:"",c:""}];buildForm();
 document.querySelectorAll("#form input:not([type=checkbox]):not([type=radio]),#ds input").forEach(e=>{e.value=""});
 document.querySelectorAll("#form select,#form2 select,#ds select").forEach(e=>{e.selectedIndex=0});
 document.querySelectorAll("#form input[type=checkbox],#form2 input[type=checkbox]").forEach(e=>{e.checked=false});
 upd();window.scrollTo(0,0)};

$("add").onclick=()=>{const L=document.querySelectorAll("#ds .dl"),l=L[L.length-1],g=k=>l&&l.querySelector('[data-f="'+k+'"]')?l.querySelector('[data-f="'+k+'"]').value:"",a=d[d.length-1]||{};d.push({p:a.p||"",q:g("q").replace(/\D/g,"")||a.q||"",f:g("f")||a.f||"",h:"",c:""});buildDs();upd()};

function hist(){const n=S.hist.length;$("hc").textContent=n?(hi+1)+" de "+n:"vacío ⛔";$("hv").textContent=n?S.hist[hi]:"Aún no hay mensajes enviados.";$("hp").disabled=hi<=0;$("hn").disabled=hi>=n-1}
$("hp").onclick=()=>{if(hi>0)hi--;hist()};$("hn").onclick=()=>{if(hi<S.hist.length-1)hi++;hist()};
function lists(){$("ph").value=S.phone;["personal","productos","terminales","clientes","estab"].forEach(k=>$("l_"+k).value=S.lists[k].join("\n"))}
$("sv").onclick=()=>{S.phone=$("ph").value.replace(/\D/g,"")||S.phone;["personal","productos","terminales","clientes","estab"].forEach(k=>S.lists[k]=$("l_"+k).value.split("\n").map(x=>x.trim()).filter(Boolean));sortLists();save();lists();buildForm();upd();$("sv").textContent="✅ Guardado";setTimeout(()=>$("sv").textContent="Guardar ajustes",1500)};
buildForm();buildDs();lists();hist();upd();

// ---------- Excel ----------
const hasX=typeof XLSX!=="undefined";
if(!hasX){$("im").disabled=true;$("ex").disabled=true;$("xm").textContent="No se pudo cargar el módulo de Excel en este navegador."}
$("im").onclick=()=>$("fi").click();
$("fi").onchange=async e=>{
 const file=e.target.files[0];if(!file)return;
 try{
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
  const get=n=>{const k=wb.SheetNames.find(x=>x.toLowerCase()===n);return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{header:1,defval:""}):null};
  let nl=0,nh=0;const data=get("data");
  if(data&&data.length){
   const hd=data[0].map(x=>String(x).trim().toLowerCase());
   [["personal","personal"],["productos","productos"],["clientes","clientes"],["establecimientos","estab"],["terminales","terminales"]].forEach(([h,k])=>{
    const c=hd.indexOf(h);if(c<0)return;
    data.slice(1).forEach(r=>{const v=String(r[c]||"").trim();if(v&&!S.lists[k].some(x=>x.toUpperCase()===v.toUpperCase())){S.lists[k].push(v);nl++}})})}
  const env=get("enviados");
  if(env&&env.length){env.slice(1).forEach(r=>{const v=String(r[0]||"").trim();if(v&&!S.hist.includes(v)){S.hist.unshift(v);nh++}});hi=S.hist.length-1}
  sortLists();save();lists();buildForm();hist();upd();
  $("xm").textContent="✅ "+file.name+": "+nl+" datos nuevos en las listas y "+nh+" mensajes nuevos en el histórico.";
 }catch(err){$("xm").textContent="No pude leer ese archivo. Elige un .xlsx o .xlsm."}
 e.target.value=""};
async function saveFile(name,buf){
 try{if(window.claude&&claude.use){const dl=await claude.use("downloads");if(dl){await dl.save({filename:name,data:buf});return}}}
 catch(e){if(e&&e.code==="declined")throw e}
 const type="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
 const blob=new Blob([buf],{type});
 try{const file=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}
 catch(e){if(e&&e.name==="AbortError")throw {code:"declined"}}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
$("ex").onclick=async()=>{
 if(!hasX)return;
 try{
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Historial"],...S.hist.map(x=>[x])]),"Enviados");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.log.length?S.log:[{fecha:""}]),"Pedidos");
  const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  await saveFile("Pedidos_SECSA_enviados.xlsx",buf);
  $("xm").textContent="✅ Archivo listo. Guárdalo donde quieras (por ejemplo en OneDrive) y pega su contenido en tu Excel.";
 }catch(err){$("xm").textContent=(err&&err.code==="declined")?"Guardado cancelado.":"No se pudo guardar el archivo."}};

// ---------- Sincronización entre dispositivos (misma cuenta de Claude) ----------
let REF=null;
async function pushRemote(){
 if(!REF)return;
 try{await REF.set({phone:S.phone,lists:S.lists,hist:S.hist.slice(-80),log:S.log.slice(-80),t:Date.now()})}catch(e){}}
async function initSync(){
 try{
  if(!window.claude||!claude.use)return;
  const db=await claude.use("db"),user=await claude.use("user");
  if(!db||!user)return;
  const uid=await user.id();if(!uid)return;
  REF=db.doc("data/users/"+uid+"/state");
  const snap=await REF.get();
  if(snap.exists){
   const r=snap.data()||{};
   if(r.lists)Object.keys(S.lists).forEach(k=>(r.lists[k]||[]).forEach(v=>{if(!S.lists[k].some(x=>x.toUpperCase()===String(v).toUpperCase()))S.lists[k].push(v)}));
   (r.hist||[]).forEach(v=>{if(!S.hist.includes(v))S.hist.push(v)});
   (r.log||[]).forEach(v=>{if(!S.log.some(x=>x.fecha===v.fecha&&x.cliente===v.cliente))S.log.push(v)});
   sortLists();hi=S.hist.length-1;
   try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
   lists();buildForm();hist();upd()}
  await pushRemote();
  $("sy").textContent="☁️ Datos sincronizados con tu cuenta: los verás igual en cualquier navegador donde abras esta app con tu sesión de Claude.";
 }catch(e){REF=null}}
$("sy").textContent="Los datos se guardan en este navegador (este equipo). Para pasarlos a otro equipo usa Exportar e Importar.";
initSync();
</script></body></html>
